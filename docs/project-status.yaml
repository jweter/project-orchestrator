  # Verified in PR #12 (merged): outbound GitHub API TLS validates normally
  # from inside the running container; all five product repositories have a
  # registered check_suite webhook returning HTTP 200 on delivery; each
  # GitHub Trigger node's webhook secret persists and survives a full
  # container restart; the corrected `ciFailureRouter` workflow is active.
  n8n_runtime: operational
  n8n_public_https_ingress: verified
  n8n_github_credentials: configured_and_verified
  # Second canonical router activated and verified end-to-end: the
  # `portfolioKnowledgeImpactRouter` id was stale (over the persistence
  # limit, no credentials bound). Rebuilt the canonical `keImpactRouter`
  # workflow with credentials bound and explicit UUID webhookIds (matching
  # the ciFailureRouter fix's root cause), activated it, verified its
  # webhook secrets persist and survive a restart, updated the external
  # nginx gateway allowlist for its 3 new webhook paths, and confirmed a
  # real (non-ping) `push` to `main` on knowledge-engine-core flowed
  # through the classifier and dispatch node into a successful
  # orchestrator-observe.yml workflow_dispatch run. The stale
  # `portfolioKnowledgeImpactRouter`/`portfolioCiFailureRouter` rows remain
  # inactive in the n8n database; n8n 2.38.2 has no CLI delete command, so
  # removing them requires the editor UI (see n8n/README.md).
  n8n_knowledge_engine_impact_router: operational
  compounding_timeseries: implemented
  # Recommendation-only in this slice: project_orchestrator.reinvestment
  # scores deterministic candidates from build_reinvestment_snapshot() and
  # always sets requires_jeremy_approval=true. With the store's current 2
  # real evidence windows, every candidate's confidence is below the 0.5
  # selection threshold, so `reinvestment-plan` currently selects nothing
  # and instead surfaces evidence gaps (see docs/ARCHITECTURE.md) — this is
  # the expected, fail-closed behavior at this evidence volume, not a bug.
  reinvestment_controller: implemented_recommendation_only
  # project_orchestrator.evidence_collector (`project-orchestrator
  # collect-evidence`) populates the store from real GitHub history:
  # merged-PR check-run timing across every collectible repository, plus
  # sanitized orchestrator-observe.yml dispatch artifacts for cross-repo
  # incidents. Run live against this repository's real merge history: 14
  # merged PRs analyzed, 1 dispatch-evidence window recorded. Newly
  # measurable: pr_creation_to_green_seconds, merge_cycle_seconds,
  # failure_to_repair_seconds, ci_failure_count, ci_repeat_failure_count,
  # roadmap_slices_completed_count (project-orchestrator only),
  # cross_repo_incident_count. Still permanently UNKNOWN from this
  # collector (no deterministic GitHub-observable signal exists):
  # blocked_waiting_seconds, preflight_failures_prevented_count, both
  # Product Reality debt counts, both intervention counts. With this real
  # evidence, `reinvestment-plan` now produces its first
  # confidence-qualifying (>=0.5) recommendation instead of selecting
  # nothing.
  automatic_evidence_collector: implemented
