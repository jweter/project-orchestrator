name: Preflight

on:
  push:
    branches:
      - "orchestrator/**"
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-preflight:
    runs-on: windows-latest
    # Iron God runs only on Windows (DPAPI owner control, job objects, msvcrt locks);
    # verify it on the platform it actually runs on.
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - run: python engineering/preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-evidence
          path: preflight-evidence.json
          if-no-files-found: error
