name: Preflight

on:
  push:
    branches:
      - "orchestrator/ci-acl-diagnostic-*"

permissions:
  contents: read

jobs:
  full-preflight:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Diagnose owner-control ACL on a hosted runner (read-only diagnostic)
        run: |
          whoami /user /groups | Select-String -Pattern "SID|Mandatory|Administrators"
          python -c "import tempfile,pathlib; from project_orchestrator import iron_god_owner_control as oc; d=pathlib.Path(tempfile.mkdtemp())/'ctl'; d.mkdir(); print('BEFORE', oc.directory_acl(d)); print('USER', oc.current_user_sid()); oc.enroll_owner(d); print('AFTER', oc.directory_acl(d))"
          $d = Join-Path $env:TEMP 'ctl2'; New-Item -ItemType Directory $d | Out-Null; icacls $d
