name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # Iron God runs only on Windows (DPAPI owner control, job objects, msvcrt locks);
    # verify it on the platform it actually runs on.
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - run: python engineering/validate_control_plane.py
      - run: python engineering/validate_portfolio.py
      - run: python -m ruff check src scripts engineering tests
      - run: python -m mypy
      - run: python -m pytest -q
      - run: project-orchestrator validate
