name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; cancelling it saves runner time.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # Iron God runs only on Windows (DPAPI owner control, job objects, msvcrt locks);
    # verify it on the platform it actually runs on.
    env:
      PYTHONUTF8: "1"
    steps:
      - run: git config --global core.longpaths true
      - name: Put test temp on the runner drive with the most free space
        # The storage-pressure allocation gate (35 GiB) runs for real in the proofs.
        shell: pwsh
        run: |
          $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free }
          $drives | Format-Table Name, @{n='FreeGiB'; e={[math]::Round($_.Free / 1GB, 1)}}
          $best = $drives | Sort-Object Free -Descending | Select-Object -First 1
          $t = Join-Path $best.Root 't'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TEMP=$t" >> $env:GITHUB_ENV
          "TMP=$t" >> $env:GITHUB_ENV
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev,mcp]"
      - run: python engineering/validate_control_plane.py
      - run: python engineering/validate_portfolio.py
      - run: python -m ruff check src scripts engineering tests
      - run: python -m mypy
      - run: python -m pytest -q
      - run: project-orchestrator validate
