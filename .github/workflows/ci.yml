name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python engineering/validate_control_plane.py
      - run: python engineering/validate_portfolio.py
      - run: python -m pytest -q
      - run: project-orchestrator validate
