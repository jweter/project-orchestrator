[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-orchestrator"
version = "0.1.0"
description = "Evidence-driven portfolio control plane for Jeremy Weter's engineering projects"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0", "hypothesis>=6.0", "ruff>=0.13", "mypy>=1.18"]

[project.scripts]
project-orchestrator = "project_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = [
  "src/project_orchestrator/runtime_leases.py",
  "src/project_orchestrator/execution_runtime.py",
  "src/project_orchestrator/branch_lifecycle.py",
  "src/project_orchestrator/branch_reconciliation.py",
]
