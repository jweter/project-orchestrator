services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.38.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in n8n/.env}"
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL:-}"
      N8N_PROXY_HOPS: "${N8N_PROXY_HOPS:-1}"
      NODE_EXTRA_CA_CERTS: "/opt/n8n-extra-ca/github-chain.pem"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      GENERIC_TIMEZONE: "America/Chicago"
      TZ: "America/Chicago"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./pki:/opt/n8n-extra-ca:ro

volumes:
  n8n_data:
